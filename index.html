<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Yash Kolekar — Data Scientist · AI Engineer</title>
<meta name="description" content="Yash Kolekar — Data Scientist and AI Engineer in Bengaluru. Generative AI, RAG pipelines and agentic systems." />
<meta name="theme-color" content="#0b0d12" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='bold' font-size='28' fill='%23ffb547' text-anchor='middle'%3EYK%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root{--bg:#0b0d12;--ink:#e8ecf5;--dim:#9aa4bd;--line:rgba(160,185,255,.14);--out:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;display:block}
  .mono{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
  h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;font-weight:800;letter-spacing:-.03em;margin:0}

  header{position:fixed;top:0;left:0;padding:clamp(1.1rem,3vw,2rem);z-index:5;pointer-events:none}
  header h1{font-size:clamp(1.1rem,1rem+1vw,1.6rem)}
  header p{margin:.3rem 0 0;color:var(--dim)}
  .hint{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);color:var(--dim);z-index:5;
        opacity:.85;text-align:center;pointer-events:none;transition:opacity .5s var(--out)}
  .hint.gone{opacity:0}

  /* planet labels, positioned each frame from the 3D projection */
  #labels{position:fixed;inset:0;z-index:4;pointer-events:none}
  .lab{position:absolute;transform:translate(-50%,-50%);padding:.3rem .7rem;border-radius:999px;
       border:1px solid var(--line);background:rgba(12,16,26,.55);backdrop-filter:blur(6px);
       color:var(--ink);cursor:pointer;pointer-events:auto;white-space:nowrap;
       transition:border-color .25s var(--out),background-color .25s var(--out),opacity .3s var(--out)}
  .lab:hover{border-color:currentColor;background:rgba(18,24,38,.8)}

  #panel{position:fixed;top:0;right:0;width:min(27rem,92vw);height:100%;z-index:8;
         padding:clamp(1.4rem,3vw,2.4rem);overflow-y:auto;
         background:rgba(13,17,26,.72);backdrop-filter:blur(22px) saturate(140%);
         -webkit-backdrop-filter:blur(22px) saturate(140%);border-left:1px solid var(--line);
         transform:translateX(104%);transition:transform .6s var(--out);}
  #panel.open{transform:none}
  #panel h2{font-size:clamp(1.4rem,1.2rem+1.4vw,2rem);margin-bottom:.4rem}
  #panel .kicker{color:var(--dim);margin-bottom:1.6rem}
  #panel .row{padding:.95rem 0;border-top:1px solid var(--line)}
  #panel .row b{display:block;font-weight:600;font-size:.95rem}
  #panel .row span{color:var(--dim);font-size:.85rem}
  #close{position:absolute;top:1rem;right:1rem;width:2.2rem;height:2.2rem;border-radius:50%;
         border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;font-size:1.1rem;line-height:1}
  .btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.2rem;padding:.7rem 1.2rem;border-radius:999px;
       border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);
       font:inherit;font-size:.85rem;cursor:pointer;transition:border-color .25s var(--out)}
  .btn:hover{border-color:var(--ink)}
  #back{position:fixed;left:50%;bottom:1.6rem;transform:translate(-50%,180%);z-index:8;
        padding:.7rem 1.4rem;border-radius:999px;border:1px solid var(--line);
        background:rgba(13,17,26,.7);backdrop-filter:blur(10px);color:var(--ink);font:inherit;
        font-size:.85rem;cursor:pointer;transition:transform .5s var(--out)}
  #back.show{transform:translate(-50%,0)}
  a{color:inherit}

  @media(max-width:700px){
    #panel{top:auto;bottom:0;width:100%;height:min(74svh,34rem);border-left:0;border-top:1px solid var(--line);
           border-radius:20px 20px 0 0;transform:translateY(104%)}
    #panel.open{transform:none}
    #back{bottom:calc(min(74svh,34rem) + .8rem)}
  }
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<header>
  <h1>Yash Kolekar</h1>
  <p class="mono">Data Scientist · AI Engineer · Bengaluru</p>
</header>

<div id="labels"></div>
<p class="hint mono" id="hint">Click a planet to explore</p>

<aside id="panel" aria-live="polite">
  <button id="close" aria-label="Close">✕</button>
  <div id="panelBody"></div>
</aside>
<button id="back">← Back to orbit</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- content ---------- */
  var SECTIONS = [
    { id:'about', label:'About', color:0xffb547, orbit:11, speed:.22, tilt:.18,
      kicker:'Who you are hiring',
      rows:[['B.Tech, Computer Science Engineering','Solapur University · 2020–24 · CGPA 9.02'],
            ['AWS Certified Cloud Practitioner','Cloud fundamentals, deployment and cost'],
            ['Machine Learning Specialization','Coursera']] },
    { id:'projects', label:'Projects', color:0x7fb7ff, orbit:15, speed:.16, tilt:-.12,
      kicker:'Things I have shipped',
      rows:[['QuantScan PRO','NSE/BSE swing scanner with LLM scoring'],
            ['SmartNotes','Local RAG over your own notes, NotebookLM-style'],
            ['Travel Reimbursement Agent','Agentic AI — HCLTech case study'],
            ['AIOps Chatbot','Conversational assistant over operations data — Infosys']] },
    { id:'experience', label:'Experience', color:0xf0866a, orbit:19, speed:.12, tilt:.26,
      kicker:'Where I have worked',
      rows:[['Infosys — via Giniminds','Sep 2026 — present'],
            ['Webcrypt Technology','Apr 2026 — Sep 2026'],
            ['HotelKey','Jan 2025 — Mar 2026'],
            ['Starlite Infotech','Feb 2024 — Dec 2024']] },
    { id:'contact', label:'Contact', color:0xc9d3e6, orbit:23, speed:.09, tilt:-.2,
      kicker:'Say hello',
      rows:[['yash.kolekar1010@gmail.com','Usually the fastest way to reach me']],
      mail:true }
  ];

  /* ---------- scene ---------- */
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b0d12, .018);
  var camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 400);
  var renderer = new THREE.WebGLRenderer({ canvas:document.getElementById('c'), antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene.add(new THREE.AmbientLight(0x8fa6d8, .55));
  var key = new THREE.PointLight(0xaecbff, 1.7, 170); key.position.set(18,22,18); scene.add(key);
  var warm = new THREE.PointLight(0xffb547, 1.1, 150); warm.position.set(-22,-10,10); scene.add(warm);

  /* starfield */
  (function () {
    var n = 1400, p = new Float32Array(n*3);
    for (var i=0;i<n;i++){
      var r = 90 + Math.random()*140, t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      p[i*3] = r*Math.sin(ph)*Math.cos(t); p[i*3+1] = r*Math.cos(ph); p[i*3+2] = r*Math.sin(ph)*Math.sin(t);
    }
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x9fb4e8, size:.55, sizeAttenuation:true, transparent:true, opacity:.9 })));
  })();

  /* ---------- neural core: points on a sphere, joined when close ---------- */
  var core = new THREE.Group(); scene.add(core);
  (function () {
    var N = 110, R = 4.4, v = [];
    for (var i=0;i<N;i++){
      var t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      v.push(new THREE.Vector3(R*Math.sin(ph)*Math.cos(t), R*Math.cos(ph), R*Math.sin(ph)*Math.sin(t)));
    }
    var pp = new Float32Array(N*3);
    v.forEach(function(q,i){ pp[i*3]=q.x; pp[i*3+1]=q.y; pp[i*3+2]=q.z; });
    var pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pp,3));
    core.add(new THREE.Points(pg, new THREE.PointsMaterial({ color:0xbcd4ff, size:.17, transparent:true, opacity:.95 })));

    var seg = [];
    for (var a=0;a<N;a++) for (var b=a+1;b<N;b++)
      if (v[a].distanceTo(v[b]) < 2.3) seg.push(v[a].x,v[a].y,v[a].z, v[b].x,v[b].y,v[b].z);
    var lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg),3));
    core.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color:0x5f8fe0, transparent:true, opacity:.3 })));

    core.add(new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32),
      new THREE.MeshBasicMaterial({ color:0x3d6ddb, transparent:true, opacity:.19 })));
  })();

  /* ---------- planets on tilted orbits ---------- */
  var shapes = {
    about:      function(){ return new THREE.IcosahedronGeometry(1.9, 0); },
    projects:   function(){ return new THREE.TorusKnotGeometry(1.15, .4, 90, 14); },
    experience: function(){ return new THREE.DodecahedronGeometry(1.9, 0); },
    contact:    function(){ return new THREE.TorusGeometry(1.35, .48, 14, 38); }
  };
  var planets = [], hitList = [];

  SECTIONS.forEach(function (s) {
    var pivot = new THREE.Group(); pivot.rotation.x = s.tilt; scene.add(pivot);

    var ringPts = [];
    for (var a=0;a<=128;a++){ var th = a/128*Math.PI*2; ringPts.push(new THREE.Vector3(Math.cos(th)*s.orbit, 0, Math.sin(th)*s.orbit)); }
    pivot.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ringPts),
      new THREE.LineBasicMaterial({ color:s.color, transparent:true, opacity:.2 })));

    var holder = new THREE.Group(); pivot.add(holder);
    var geo = shapes[s.id]();
    var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color:s.color, flatShading:true, metalness:.62, roughness:.38,
      emissive:s.color, emissiveIntensity:.14 }));
    var shell = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color:s.color, wireframe:true, transparent:true, opacity:.3 }));
    shell.scale.setScalar(1.38);
    holder.add(mesh); holder.add(shell);

    var lab = document.createElement('button');
    lab.className = 'lab mono'; lab.textContent = s.label;
    lab.style.color = '#' + s.color.toString(16).padStart(6,'0');
    lab.addEventListener('click', function(){ focus(p); });
    document.getElementById('labels').appendChild(lab);

    var p = { s:s, pivot:pivot, holder:holder, mesh:mesh, shell:shell, lab:lab,
              angle:Math.random()*Math.PI*2, spin:0, pop:1 };
    mesh.userData.p = p;
    planets.push(p); hitList.push(mesh);
  });

  /* ---------- particle burst + shockwave, reused for every click ---------- */
  var BN = 150, bPos = new Float32Array(BN*3), bVel = [], bLife = 0;
  for (var i=0;i<BN;i++) bVel.push(new THREE.Vector3());
  var bGeo = new THREE.BufferGeometry(); bGeo.setAttribute('position', new THREE.BufferAttribute(bPos,3));
  var bMat = new THREE.PointsMaterial({ size:.24, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false });
  var burst = new THREE.Points(bGeo, bMat); scene.add(burst);

  var waveMat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false });
  var wave = new THREE.Mesh(new THREE.RingGeometry(1, 1.14, 64), waveMat); scene.add(wave);
  var wLife = 0;

  function boom(pos, color) {
    if (CALM) return;
    bMat.color.setHex(color); waveMat.color.setHex(color);
    for (var i=0;i<BN;i++){
      bPos[i*3]=pos.x; bPos[i*3+1]=pos.y; bPos[i*3+2]=pos.z;
      bVel[i].set(Math.random()-.5, Math.random()-.5, Math.random()-.5).normalize().multiplyScalar(.12+Math.random()*.3);
    }
    bGeo.attributes.position.needsUpdate = true; bLife = 1;
    wave.position.copy(pos); wave.scale.setScalar(.4); wLife = 1;
  }

  /* ---------- camera ---------- */
  var OVERVIEW = new THREE.Vector3(0, 13, 36);
  var camGoal = OVERVIEW.clone();
  var lookGoal = new THREE.Vector3(0,0,0);
  var lookNow = new THREE.Vector3(0,0,0);
  var focused = null, mouse = { x:0, y:0 };
  camera.position.set(0, 40, 180);
  if (CALM) camera.position.copy(OVERVIEW);

  var panel = document.getElementById('panel');
  var body = document.getElementById('panelBody');
  var back = document.getElementById('back');
  var hint = document.getElementById('hint');

  function focus(p) {
    focused = p;
    hint.classList.add('gone');
    var w = p.mesh.getWorldPosition(new THREE.Vector3());
    /* Fit the planet to frame instead of guessing a distance: on a narrow
       viewport the HORIZONTAL fov collapses, so the same offset that frames
       it on a laptop fills the whole screen on a phone. */
    var vF = camera.fov * Math.PI/180;
    var hF = 2*Math.atan(Math.tan(vF/2) * camera.aspect);
    var off = 3.6 / Math.tan(Math.min(vF, hF)/2) * 1.35;
    camGoal.copy(w).add(w.clone().normalize().multiplyScalar(off)).add(new THREE.Vector3(0, off*.34, 0));
    lookGoal.copy(w);
    if (innerWidth < 700) lookGoal.y -= off*.3;   // lift it clear of the bottom sheet
    p.spin = 1; p.pop = 1.55;
    boom(w, p.s.color);

    var s = p.s, html = '<h2>' + s.label + '</h2><p class="kicker mono">' + s.kicker + '</p>';
    s.rows.forEach(function(r){ html += '<div class="row"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'; });
    if (s.mail) html += '<button class="btn" id="copy">Copy email address</button>' +
                        '<a class="btn" href="mailto:yash.kolekar1010@gmail.com">Open mail app</a>';
    body.innerHTML = html;
    panel.classList.add('open'); back.classList.add('show');

    var c = document.getElementById('copy');
    if (c) c.addEventListener('click', function () {
      navigator.clipboard.writeText('yash.kolekar1010@gmail.com')
        .then(function(){ c.textContent = 'Copied ✓'; setTimeout(function(){ c.textContent = 'Copy email address'; }, 1800); })
        .catch(function(){ c.textContent = 'Press Ctrl+C'; });
    });
  }

  function unfocus() {
    focused = null;
    camGoal.copy(OVERVIEW); lookGoal.set(0,0,0);
    panel.classList.remove('open'); back.classList.remove('show');
  }

  /* ---------- input ---------- */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hover = null;
  var canvas = renderer.domElement;

  canvas.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX/innerWidth - .5; mouse.y = e.clientY/innerHeight - .5;
    ndc.x = mouse.x*2; ndc.y = -mouse.y*2;
    ray.setFromCamera(ndc, camera);
    var hit = ray.intersectObjects(hitList)[0];
    hover = hit ? hit.object.userData.p : null;
    canvas.style.cursor = hover ? 'pointer' : 'default';
  });

  canvas.addEventListener('click', function () {
    if (hover) focus(hover); else if (focused) unfocus();
  });
  back.addEventListener('click', unfocus);
  document.getElementById('close').addEventListener('click', unfocus);
  addEventListener('keydown', function (e) { if (e.key === 'Escape') unfocus(); });

  addEventListener('resize', function () {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ---------- loop ---------- */
  var clock = new THREE.Clock(), tmp = new THREE.Vector3();

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

    if (!CALM) { core.rotation.y += dt*.12; core.rotation.x = Math.sin(t*.2)*.12; }

    planets.forEach(function (p) {
      if (!focused && !CALM) p.angle += dt*p.s.speed;          // orbits pause while focused
      p.holder.position.set(Math.cos(p.angle)*p.s.orbit, 0, Math.sin(p.angle)*p.s.orbit);

      if (!CALM) {
        p.mesh.rotation.y += dt*(.5 + p.spin*7); p.mesh.rotation.x += dt*.25;
        p.shell.rotation.y -= dt*(.8 + p.spin*4); p.shell.rotation.x -= dt*.15;   // shell counter-spins
      }
      p.spin *= .94; p.pop += (1 - p.pop)*.09;

      var want = (hover === p || focused === p) ? 1.3 : 1;
      p.holder.scale.lerp(tmp.set(want,want,want).multiplyScalar(p.pop), .12);
      p.mesh.material.emissiveIntensity += (((hover===p||focused===p) ? .42 : .14) - p.mesh.material.emissiveIntensity)*.12;

      var w = p.mesh.getWorldPosition(tmp.clone()).project(camera);
      var on = w.z < 1 && !(focused && focused !== p);
      p.lab.style.opacity = on ? 1 : 0;
      p.lab.style.pointerEvents = on ? 'auto' : 'none';
      p.lab.style.left = (w.x*.5+.5)*innerWidth + 'px';
      p.lab.style.top  = (-w.y*.5+.5)*innerHeight - 42 + 'px';
    });

    if (bLife > 0) {
      bLife -= dt*.85;
      for (var i=0;i<BN;i++){
        bPos[i*3] += bVel[i].x; bPos[i*3+1] += bVel[i].y; bPos[i*3+2] += bVel[i].z;
        bVel[i].multiplyScalar(.95);
      }
      bGeo.attributes.position.needsUpdate = true;
      bMat.opacity = Math.max(bLife, 0);
    }
    if (wLife > 0) {
      wLife -= dt*1.1;
      wave.scale.setScalar(.4 + (1-wLife)*9);
      wave.lookAt(camera.position);
      waveMat.opacity = Math.max(wLife, 0)*.6;
    }

    /* mouse parallax only in overview, so a focused shot stays steady */
    var gx = camGoal.x, gy = camGoal.y;
    if (!focused && !CALM) { gx += mouse.x*7; gy += -mouse.y*4; }
    camera.position.lerp(tmp.set(gx, gy, camGoal.z), CALM ? 1 : .045);
    lookNow.lerp(lookGoal, CALM ? 1 : .07);
    camera.lookAt(lookNow);

    renderer.render(scene, camera);
  }
  frame();
})();
</script>
</body>
</html>
